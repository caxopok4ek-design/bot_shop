<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smoky Mountain | Shop App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Manrope', 'sans-serif'] }, colors: { appBg: '#0b0c10', surface: '#171821', surfaceHover: '#1f202d', primary: '#ff3b5c', accent: '#f59e0b', tgBlue: '#2AABEE' } } } }
    </script>
    <style>
        body { background-color: #050507; color: white; -webkit-tap-highlight-color: transparent; overflow: hidden; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .glass-panel { background: rgba(23, 24, 33, 0.85); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const tg = window.Telegram?.WebApp;

        const Icons = {
            Home: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>,
            Grid: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>,
            Cart: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>,
            Heart: ({c, fill}) => <svg className={c} width="24" height="24" fill={fill || "none"} stroke="currentColor" strokeWidth="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>,
            User: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Plus: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Minus: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M5 12h14"/></svg>,
            Trash: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg>,
            Search: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            ChevronRight: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m9 18 6-6-6-6"/></svg>,
            X: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            Flame: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>,
            Sparkles: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>,
            Check: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>,
            MapPin: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>,
            Store: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/></svg>,
            CreditCard: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>,
        };

        const FALLBACK = [{ id: 1, title: 'Тестовый товар', category: 'Жидкости', price: 500, tag: 'NEW', desc: 'Описание', img: 'https://images.unsplash.com/photo-1558397453-94826230dcb6?q=80&w=600' }];

        const Toast = ({ message, onClose }) => {
            useEffect(() => { const t = setTimeout(onClose, 2000); return () => clearTimeout(t); }, [onClose]);
            return <div className="fixed top-20 left-1/2 -translate-x-1/2 z-[200] bg-surface px-5 py-3 rounded-2xl border border-primary/20 font-bold text-sm flex items-center gap-2 shadow-xl"><Icons.Sparkles c="w-4 h-4 text-primary" /> {message}</div>;
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-end md:items-center justify-center bg-black/70 backdrop-blur-sm" onClick={onClose}>
                    <div className="bg-surface w-full max-w-md rounded-t-[2rem] p-6 border-t border-white/10 max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-4"><h2 className="text-xl font-extrabold">{title}</h2><button onClick={onClose} className="p-2 bg-surfaceHover rounded-full"><Icons.X c="w-5 h-5" /></button></div>
                        {children}
                    </div>
                </div>
            );
        };

        const ProductCard = ({ product, isFav, onFav, onClick, onQuickAdd }) => (
            <div className="bg-surface rounded-3xl p-2.5 border border-white/5 relative flex flex-col cursor-pointer active:scale-95 transition-transform" onClick={() => onClick(product)}>
                <div className="relative w-full aspect-[4/5] rounded-2xl overflow-hidden bg-gray-800 mb-3">
                    <img src={product.img} className="w-full h-full object-cover" />
                    <span className="absolute top-2 left-2 bg-primary text-white text-[10px] font-black px-2 py-1 rounded-lg uppercase">{product.tag}</span>
                    <button onClick={(e) => { e.stopPropagation(); onFav(product.id); }} className="absolute top-2 right-2 p-2 bg-black/40 rounded-full"><Icons.Heart c={`w-4 h-4 ${isFav ? 'text-primary fill-primary' : 'text-white'}`}/></button>
                    <button onClick={(e) => { e.stopPropagation(); onQuickAdd(product); }} className="absolute bottom-2 right-2 w-9 h-9 bg-white text-black rounded-full flex items-center justify-center"><Icons.Plus c="w-5 h-5" /></button>
                </div>
                <div className="px-1 flex-1 flex flex-col justify-between">
                    <div><div className="text-[10px] text-gray-400 font-bold uppercase">{product.category}</div><h3 className="text-sm font-extrabold text-white leading-tight line-clamp-2">{product.title}</h3></div>
                    <div className="mt-2 text-lg font-black">{product.price} ₽</div>
                </div>
            </div>
        );

        const HomeScreen = ({ PRODUCTS, setTab, openModal, favorites, toggleFav, quickAdd }) => (
            <div className="pb-28 pt-2 space-y-6">
                <div className="mx-4 rounded-[2rem] overflow-hidden relative h-52 bg-surface flex flex-col justify-end p-5" onClick={() => setTab('catalog')}>
                    <img src="https://images.unsplash.com/photo-1558397453-94826230dcb6?q=80&w=1200" className="absolute inset-0 w-full h-full object-cover opacity-50" />
                    <div className="absolute inset-0 bg-gradient-to-t from-appBg via-appBg/50 to-transparent"></div>
                    <div className="relative z-10"><span className="bg-primary text-white text-[10px] font-black px-3 py-1 rounded-full uppercase mb-2 inline-block">Скидка 20%</span><h2 className="text-2xl font-black">Промокод<br/>MOUNTAIN</h2></div>
                </div>
                <div>
                    <div className="px-4 flex justify-between items-center mb-3"><h3 className="text-xl font-extrabold">Хиты продаж</h3><button onClick={() => setTab('catalog')} className="text-sm font-bold text-primary">Все <Icons.ChevronRight c="w-4 h-4 inline"/></button></div>
                    <div className="flex gap-3 overflow-x-auto hide-scrollbar px-4 pb-2">
                        {PRODUCTS.slice(0, 3).map(p => <div key={p.id} className="min-w-[150px] w-[150px]"><ProductCard product={p} isFav={favorites.includes(p.id)} onFav={toggleFav} onClick={(p) => openModal('product', p)} onQuickAdd={quickAdd} /></div>)}
                    </div>
                </div>
            </div>
        );

        const CatalogScreen = ({ PRODUCTS, openModal, favorites, toggleFav, quickAdd }) => {
            const [cat, setCat] = useState('Все'); const [search, setSearch] = useState('');
            const filtered = PRODUCTS.filter(p => (cat === 'Все' || p.category.toLowerCase() === cat.toLowerCase()) && p.title.toLowerCase().includes(search.toLowerCase()));
            return (
                <div className="pb-28 pt-4">
                    <div className="flex gap-2 px-4 overflow-x-auto hide-scrollbar mb-4">{[ 'Все', 'Жидкости', 'Одноразки' ].map(c => <button key={c} onClick={() => setCat(c)} className={`px-5 py-2.5 rounded-full text-sm font-bold whitespace-nowrap ${cat === c ? 'bg-white text-black' : 'bg-surface text-gray-400'}`}>{c}</button>)}</div>
                    <div className="px-4 mb-5 relative"><Icons.Search c="w-5 h-5 absolute left-4 top-3.5 text-gray-500" /><input type="text" placeholder="Поиск..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full bg-surface rounded-2xl py-3.5 pl-12 pr-4 text-sm" /></div>
                    <div className="px-4 grid grid-cols-2 gap-3">{filtered.map(p => <ProductCard key={p.id} product={p} isFav={favorites.includes(p.id)} onFav={toggleFav} onClick={(p) => openModal('product', p)} onQuickAdd={quickAdd} />)}</div>
                </div>
            );
        };

        const CartScreen = ({ cart, updateQty, removeItem, goToCheckout }) => {
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            if (cart.length === 0) return <div className="text-center pt-32"><Icons.Cart c="w-16 h-16 mx-auto text-gray-600 mb-4" /><h2 className="text-xl font-black">Корзина пуста</h2></div>;
            return (
                <div className="pb-32 pt-4 px-4">
                    <h2 className="text-2xl font-black mb-5">Корзина</h2>
                    <div className="space-y-3">
                        {cart.map((item) => (
                            <div key={item.id} className="bg-surface p-3 rounded-3xl flex gap-3 relative">
                                <img src={item.img} className="w-20 h-24 rounded-2xl object-cover" />
                                <div className="flex flex-col justify-between flex-1 py-1">
                                    <div><h4 className="font-bold text-sm leading-tight line-clamp-2">{item.title}</h4><p className="text-primary font-black mt-1">{item.price} ₽</p></div>
                                    <div className="flex items-center gap-3 mt-2">
                                        <button onClick={() => updateQty(item.id, -1)} className="w-8 h-8 bg-surfaceHover rounded-full flex items-center justify-center"><Icons.Minus c="w-4 h-4"/></button>
                                        <span className="font-bold text-sm">{item.qty}</span>
                                        <button onClick={() => updateQty(item.id, 1)} className="w-8 h-8 bg-surfaceHover rounded-full flex items-center justify-center"><Icons.Plus c="w-4 h-4"/></button>
                                    </div>
                                </div>
                                <button onClick={() => removeItem(item.id)} className="absolute top-3 right-3 text-gray-500"><Icons.Trash c="w-4 h-4"/></button>
                            </div>
                        ))}
                    </div>
                    <div className="fixed bottom-20 left-0 right-0 p-4 bg-appBg/95 border-t border-white/5 max-w-md mx-auto">
                        <div className="flex justify-between items-center mb-3"><span className="text-gray-400">Итого:</span><span className="text-2xl font-black">{total} ₽</span></div>
                        <button onClick={goToCheckout} className="w-full bg-primary py-4 rounded-2xl font-black text-lg">Оформить заказ</button>
                    </div>
                </div>
            );
        };

        const CheckoutScreen = ({ cart, tgUser, onBack, onSubmit }) => {
            const [name, setName] = useState(tgUser?.first_name || '');
            const [phone, setPhone] = useState('');
            const [delivery, setDelivery] = useState('Самовывоз');
            const [address, setAddress] = useState('');
            const [payment, setPayment] = useState('При получении');

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const isFormValid = name.trim().length > 1 && phone.trim().length > 5 && (delivery === 'Самовывоз' || address.trim().length > 3);

            const handlePhoneChange = (e) => {
                let val = e.target.value.replace(/\D/g, '');
                if (val.length > 0) {
                    if (val[0] === '8') val = '7' + val.slice(1);
                    let formatted = '+7 ';
                    if (val.length > 1) formatted += `(${val.slice(1, 4)}`;
                    if (val.length > 4) formatted += `) ${val.slice(4, 7)}`;
                    if (val.length > 7) formatted += `-${val.slice(7, 9)}`;
                    if (val.length > 9) formatted += `-${val.slice(9, 11)}`;
                    setPhone(formatted);
                } else setPhone('');
            };

            return (
                <div className="pb-28 pt-4 px-4 max-w-2xl mx-auto">
                    <div className="flex items-center gap-3 mb-6"><button onClick={onBack} className="p-2 bg-surface rounded-full"><Icons.ChevronRight c="w-5 h-5 rotate-180" /></button><h2 className="text-2xl font-black">Оформление</h2></div>
                    <div className="space-y-6">
                        <div className="space-y-3 bg-surface p-5 rounded-3xl">
                            <h3 className="text-sm font-bold text-gray-400 uppercase">Получатель</h3>
                            <input type="text" placeholder="Ваше имя" value={name} onChange={e => setName(e.target.value)} className="w-full bg-appBg rounded-xl p-4 text-sm text-white" />
                            <input type="tel" placeholder="+7 (___) ___-__-__" value={phone} onChange={handlePhoneChange} className="w-full bg-appBg rounded-xl p-4 text-sm text-white" />
                        </div>
                        <div className="space-y-3">
                            <h3 className="text-sm font-bold text-gray-400 uppercase">Способ получения</h3>
                            <div className="grid grid-cols-2 gap-3">
                                <button onClick={() => setDelivery('Самовывоз')} className={`p-4 rounded-2xl border flex flex-col items-center gap-2 ${delivery === 'Самовывоз' ? 'bg-primary/10 border-primary' : 'bg-surface border-white/5 text-gray-400'}`}><Icons.Store c="w-6 h-6" /> <span className="text-xs font-bold">Самовывоз</span></button>
                                <button onClick={() => setDelivery('Встреча')} className={`p-4 rounded-2xl border flex flex-col items-center gap-2 ${delivery === 'Встреча' ? 'bg-primary/10 border-primary' : 'bg-surface border-white/5 text-gray-400'}`}><Icons.MapPin c="w-6 h-6" /> <span className="text-xs font-bold">Встреча</span></button>
                            </div>
                            {delivery === 'Встреча' && (
                                <input type="text" placeholder="Удобное место встречи или район" value={address} onChange={e => setAddress(e.target.value)} className="w-full bg-surface rounded-xl p-4 text-sm text-white mt-2" />
                            )}
                        </div>
                        <div className="space-y-3">
                            <h3 className="text-sm font-bold text-gray-400 uppercase">Оплата</h3>
                            <div className="bg-surface rounded-2xl border border-white/5 overflow-hidden">
                                <button onClick={() => setPayment('При получении')} className="w-full flex justify-between p-4 border-b border-white/5"><span className="text-sm">При получении</span><div className={`w-5 h-5 rounded-full border-2 ${payment === 'При получении' ? 'border-primary' : 'border-gray-600'}`}></div></button>
                                <button onClick={() => setPayment('Telegram Stars')} className="w-full flex justify-between p-4"><span className="text-sm">Telegram Stars</span><div className={`w-5 h-5 rounded-full border-2 ${payment === 'Telegram Stars' ? 'border-tgBlue' : 'border-gray-600'}`}></div></button>
                            </div>
                        </div>
                    </div>
                    <div className="fixed bottom-20 left-0 right-0 p-4 bg-appBg/95 border-t border-white/5 max-w-md mx-auto">
                        <div className="flex justify-between items-center mb-3"><span className="text-gray-400">Итого:</span><span className="text-2xl font-black">{subtotal} ₽</span></div>
                        <button onClick={() => onSubmit({ name, phone, delivery, address, payment, total: subtotal })} disabled={!isFormValid} className={`w-full py-4 rounded-2xl font-black text-lg ${isFormValid ? 'bg-primary text-white' : 'bg-surfaceHover text-gray-500'}`}>Отправить заказ</button>
                    </div>
                </div>
            );
        };

        const SuccessScreen = ({ orderData, onGoHome }) => (
            <div className="flex flex-col items-center justify-center h-[75vh] px-6 text-center">
                <div className="w-24 h-24 bg-green-500/20 rounded-full flex items-center justify-center mb-6"><div className="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center"><Icons.Check c="w-8 h-8 text-white" /></div></div>
                <h2 className="text-3xl font-black mb-2">Заказ отправлен!</h2>
                <p className="text-gray-400 text-sm mb-6">Ожидайте подтверждения от магазина.</p>
                <div className="bg-surface rounded-2xl p-4 w-full max-w-[280px] mb-8 border border-white/5"><div className="text-xs text-gray-400 mb-1">Номер заказа:</div><div className="text-2xl font-black text-primary">#{orderData?.id}</div><div className="text-xs text-gray-400 mt-2">Сумма: {orderData?.total} ₽</div></div>
                <button onClick={onGoHome} className="w-full max-w-[280px] bg-primary py-4 rounded-2xl font-black text-white">На главную</button>
            </div>
        );

        const App = () => {
            const [tab, setTab] = useState('home');
            const [modal, setModal] = useState(null);
            const [toast, setToast] = useState(null);
            const [tgUser, setTgUser] = useState(null);
            const [lastOrder, setLastOrder] = useState(null);
            const [PRODUCTS, setProducts] = useState(FALLBACK);
            const [favorites, setFavorites] = useState([]);
            const [cart, setCart] = useState([]);

            useEffect(() => { fetch('./products.json').then(r => r.json()).then(data => setProducts(Array.isArray(data) && data.length ? data : FALLBACK)).catch(() => setProducts(FALLBACK)); }, []);
            useEffect(() => { if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0b0c10'); if (tg.initDataUnsafe?.user) setTgUser(tg.initDataUnsafe.user); } }, []);

            const showToast = (msg) => setToast(msg);
            const toggleFav = (id) => setFavorites(prev => prev.includes(id) ? prev.filter(f => f !== id) : [...prev, id]);
            const quickAdd = (product) => { setCart(prev => { const existing = prev.find(item => item.id === product.id); if (existing) return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item); return [...prev, { ...product, qty: 1 }]; }); showToast("Товар добавлен"); if (tg) tg.HapticFeedback.impactOccurred('medium'); };
            const updateQty = (id, delta) => setCart(prev => prev.map(item => { if (item.id === id) { const newQty = item.qty + delta; return newQty > 0 ? { ...item, qty: newQty } : item; } return item; }).filter(item => item.qty > 0));
            const removeItem = (id) => setCart(prev => prev.filter(item => item.id !== id));

            const handleProcessOrder = (checkoutData) => {
                const orderId = Math.floor(100000 + Math.random() * 900000);
                const payload = {
                    orderId: orderId,
                    items: cart.map(item => ({ id: item.id, title: item.title, price: item.price, qty: item.qty })),
                    total: checkoutData.total,
                    phone: checkoutData.phone,
                    delivery: checkoutData.delivery,
                    address: checkoutData.address || '—',
                    payment: checkoutData.payment
                };

                // Отправляем и закрываем без всяких окон
                if (tg && typeof tg.sendData === 'function') {
                    tg.sendData(JSON.stringify(payload));
                    tg.close();
                }

                setLastOrder({ id: orderId, total: checkoutData.total });
                setCart([]);
                setTab('success');
            };

            const isCheckoutMode = tab === 'checkout' || tab === 'success';

            return (
                <div className="min-h-screen bg-[#050507] flex items-center justify-center p-0">
                    <div className="w-full max-w-md h-screen relative bg-appBg flex flex-col">
                        {toast && <Toast message={toast} onClose={() => setToast(null)} />}
                        
                        {!isCheckoutMode && (
                            <div className="flex justify-between items-center p-5 bg-appBg/80 border-b border-white/5"><h1 className="text-xl font-black flex items-center gap-2"><Icons.Flame c="w-6 h-6 text-primary" /> SMOKY</h1></div>
                        )}

                        <main className="flex-1 overflow-y-auto hide-scrollbar pb-24">
                            {tab === 'home' && <HomeScreen PRODUCTS={PRODUCTS} setTab={setTab} openModal={(t, d) => setModal({type: t, data: d})} favorites={favorites} toggleFav={toggleFav} quickAdd={quickAdd} />}
                            {tab === 'catalog' && <CatalogScreen PRODUCTS={PRODUCTS} openModal={(t, d) => setModal({type: t, data: d})} favorites={favorites} toggleFav={toggleFav} quickAdd={quickAdd} />}
                            {tab === 'cart' && <CartScreen cart={cart} updateQty={updateQty} removeItem={removeItem} goToCheckout={() => setTab('checkout')} />}
                            {tab === 'checkout' && <CheckoutScreen cart={cart} tgUser={tgUser} onBack={() => setTab('cart')} onSubmit={handleProcessOrder} />}
                            {tab === 'success' && <SuccessScreen orderData={lastOrder} onGoHome={() => setTab('home')} />}
                        </main>

                        {!isCheckoutMode && (
                            <div className="absolute bottom-0 w-full glass-panel pt-2 pb-4 px-4 rounded-t-[2rem]">
                                <div className="flex justify-between items-center max-w-md mx-auto">
                                    {[
                                        { id: 'home', icon: Icons.Home, label: 'Главная' },
                                        { id: 'catalog', icon: Icons.Grid, label: 'Каталог' },
                                        { id: 'cart', icon: Icons.Cart, label: 'Корзина', count: cart.reduce((s,i)=>s+i.qty,0) }
                                    ].map(t => (
                                        <button key={t.id} onClick={() => setTab(t.id)} className={`flex flex-col items-center gap-1 ${tab === t.id ? 'text-primary' : 'text-gray-500'}`}>
                                            <div className="relative p-2 rounded-xl"><t.icon c="w-6 h-6" />{t.count > 0 && <span className="absolute top-0 right-0 bg-primary text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">{t.count}</span>}</div>
                                            <span className="text-[10px] font-bold">{t.label}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        <Modal isOpen={modal?.type === 'product'} onClose={() => setModal(null)} title="О товаре">
                            {modal?.data && (
                                <div className="flex flex-col gap-4">
                                    <img src={modal.data.img} className="w-full aspect-square rounded-2xl object-cover" />
                                    <h3 className="text-xl font-black">{modal.data.title}</h3>
                                    <p className="text-sm text-gray-400">{modal.data.desc}</p>
                                    <div className="flex justify-between items-center mt-2"><span className="text-2xl font-black">{modal.data.price} ₽</span><button onClick={() => { quickAdd(modal.data); setModal(null); }} className="bg-primary px-6 py-3 rounded-xl font-bold">В корзину</button></div>
                                </div>
                            )}
                        </Modal>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
