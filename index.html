<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GALLEON UK | Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;500;600;700;800&display=swap');

        :root {
            --bg: #050505;
            --surface: rgba(22, 22, 26, 0.85);
            --surface-solid: #16161a;
            --surface-light: #1c1c20;
            --primary: #ff8c68;
            --primary-gradient: linear-gradient(135deg, #ff8c68 0%, #ff5e3a 100%);
            --primary-glow: rgba(255, 140, 104, 0.25);
            --secondary: #ffdcb3;
            --text: #ffffff;
            --text-muted: #9e9e9e;
            --border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(16px);
            --success: #4ade80;
            --danger: #f87171;
            
            --rar-common: #9e9e9e;
            --rar-rare: #38bdf8;
            --rar-epic: #c084fc;
            --rar-legend: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { width: 0; height: 0; }

        body {
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(255, 140, 104, 0.1) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(255, 220, 179, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            background: rgba(5, 5, 5, 0.7);
            backdrop-filter: var(--glass-blur);
        }

        main { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 110px; }
        .page { display: none; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .btn-main {
            width: 100%; padding: 16px; border-radius: 12px; border: 1px solid var(--primary);
            background: var(--primary-gradient); color: #000; font-size: 16px; font-weight: 800;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 0 20px var(--primary-glow); transition: 0.3s;
        }
        .btn-main:active { transform: scale(0.97); }
        
        .section-title { font-family: 'Cinzel', serif; font-size: 22px; color: #fff; margin-bottom: 15px; text-shadow: 0 0 10px var(--primary-glow); }

        header {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); background: rgba(18, 18, 20, 0.5); backdrop-filter: var(--glass-blur); z-index: 100; position: sticky; top: 0;
        }
        .header-logo { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 8px; }
        .header-logo span { color: var(--primary); }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .header-icon {
            width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: #222;
            display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; color: var(--text);
        }
        .header-icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
        .header-badge {
            position: absolute; top: -4px; right: -4px; background: var(--primary-gradient); color: #fff; font-size: 10px; font-weight: 900; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 4px; border: 2px solid #000;
        }

        .banner-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; margin-bottom: 20px; padding-bottom: 5px; }
        .banner-slider::-webkit-scrollbar { display: none; }
        .banner-slide {
            min-width: 100%; scroll-snap-align: start;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1558397453-94826230dcb6?q=80&w=600') center/cover;
            border-radius: 20px; padding: 20px; border: 1px solid var(--border); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; min-height: 160px;
        }
        .banner-slide h2 { font-family: 'Cinzel', serif; font-size: 24px; color: #fff; margin-bottom: 10px; text-shadow: 0 2px 5px rgba(0,0,0,0.8); line-height: 1.1; }
        .banner-slide p { font-size: 12px; color: #ddd; margin-bottom: 15px; line-height: 1.4; }
        .banner-slide button { width: auto; padding: 8px 16px; font-size: 12px; align-self: flex-start; }
        
        .status-card { background: linear-gradient(90deg, rgba(255,140,104,0.15), transparent); border: 1px solid var(--primary); border-radius: 16px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; cursor: pointer; }
        .status-info h4 { color: var(--secondary); font-size: 14px; margin-bottom: 4px; }
        .status-info p { color: var(--text-muted); font-size: 11px; }
        .status-btn { background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; color: #fff; }

        .big-menu-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; cursor: pointer; transition: 0.3s; }
        .big-menu-btn:active { transform: scale(0.98); border-color: var(--primary); }
        .big-menu-btn h3 { font-family: 'Cinzel', serif; font-size: 20px; color: var(--primary); }
        .big-menu-btn .icon { font-size: 40px; filter: drop-shadow(0 0 10px var(--primary-glow)); }

        .horizontal-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
        .horizontal-scroll::-webkit-scrollbar { display: none; }
        .mini-card { min-width: 140px; background: var(--surface); border-radius: 16px; padding: 10px; border: 1px solid var(--border); cursor: pointer; }
        .mini-card .img { width: 100%; height: 100px; background: #000; border-radius: 10px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; font-size: 30px; overflow: hidden; }
        .mini-card .img img { width: 100%; height: 100%; object-fit: cover; }
        .mini-card h4 { font-size: 12px; color: #fff; line-height: 1.3; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 32px; }
        .mini-card .price { font-size: 14px; font-weight: 900; color: var(--primary); }

        .catalog-header { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-bar { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 15px; display: flex; align-items: center; gap: 10px; }
        .search-bar input { background: transparent; border: none; color: #fff; outline: none; font-size: 14px; width: 100%; }
        
        .categories-scroll { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-btn { padding: 8px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .cat-btn.active { background: var(--primary-gradient); color: #000; border-color: var(--primary); font-weight: 800; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .card { background: var(--surface); border-radius: 20px; padding: 12px; border: 1px solid var(--border); position: relative; display: flex; flex-direction: column; }
        .card-img { width: 100%; height: 140px; border-radius: 14px; background: #000; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 10px; position: relative; overflow: hidden; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .badge-top { position: absolute; top: 8px; left: 8px; background: #fbbf24; color: #000; font-size: 9px; font-weight: 900; padding: 3px 6px; border-radius: 6px; }
        .fav-btn { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
        .fav-btn.active { color: var(--primary); border-color: var(--primary); }
        
        .card-category { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
        .card-title { font-size: 13px; font-weight: 800; margin-bottom: 6px; line-height: 1.3; min-height: 34px; }
        .tag-flavors { display: inline-block; background: rgba(74, 222, 128, 0.15); color: var(--success); font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 6px; margin-bottom: 8px; }
        
        .card-price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; margin-bottom: 10px; }
        .card-price { font-size: 16px; font-weight: 900; color: #fff; }
        .card-stock { font-size: 11px; color: var(--success); font-weight: 600; display: flex; align-items: center; gap: 4px; }
        
        .btn-flavor { width: 100%; padding: 10px; border-radius: 10px; background: var(--primary-gradient); color: #000; font-weight: 800; font-size: 12px; border: none; cursor: pointer; }

        .cart-items-list { margin-bottom: 20px; }
        .cart-item { display: flex; gap: 12px; background: var(--surface); padding: 12px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 10px; }
        .cart-img { width: 70px; height: 70px; border-radius: 10px; background: #000; display: flex; align-items: center; justify-content: center; font-size: 30px; overflow: hidden; }
        .cart-img img { width: 100%; height: 100%; object-fit: cover; }
        .cart-info { flex: 1; }
