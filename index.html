<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GALLEON UK</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #121212; --surface: #1e1e1e; --primary: #ff6b4a; --text: #ffffff; --text-muted: #9e9e9e; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .hidden { display: none !important; }
        
        /* Экран 18+ */
        #age-gate { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        .logo-circle { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #ff9a76, #ff4b2b); display: flex; align-items: center; justify-content: center; font-size: 50px; margin-bottom: 20px; }
        .btn { width: 100%; padding: 16px; border-radius: 16px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: linear-gradient(90deg, #ff4b2b, #ff6b4a); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid #333; color: var(--text); }
        
        /* Приложение */
        #app { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .header h1 { font-size: 20px; font-weight: 900; }
        .content { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 100px; }
        .screen { display: none; } .screen.active { display: block; }
        
        /* Товары */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: var(--surface); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; }
        .card-img { width: 100%; height: 120px; border-radius: 8px; background: #111; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 10px; overflow: hidden; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .card-title { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
        .card-price { font-size: 18px; font-weight: 900; color: var(--primary); margin-bottom: 10px; }
        .btn-add { width: 100%; padding: 10px; border-radius: 8px; background: #333; color: #fff; border: none; font-weight: bold; cursor: pointer; }
        
        /* Корзина */
        .cart-item { display: flex; gap: 10px; background: var(--surface); padding: 10px; border-radius: 12px; margin-bottom: 10px; align-items: center; }
        .cart-img { width: 50px; height: 50px; background: #111; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        
        /* Оформление */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; margin-bottom: 5px; color: var(--text-muted); }
        .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; outline: none; }
        
        /* Меню */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #1a1a1a; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 10px; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div id="age-gate">
        <div class="logo-circle">⚓</div>
        <h1 style="font-size: 24px; font-weight: 900; margin-bottom: 10px;">GALLEON UK</h1>
        <p style="color: var(--text-muted); margin-bottom: 30px;">Вам есть 18 лет?</p>
        <button class="btn btn-primary" onclick="verifyAge()">Да, мне есть 18 лет</button>
        <button class="btn btn-outline" onclick="window.location.href='https://google.com'">Нет, мне меньше 18</button>
    </div>

    <div id="app" class="hidden">
        <div class="header">
            <h1>⚓ GALLEON</h1>
        </div>
        <div class="content">
            <div id="screen-home" class="screen active">
                <h2 style="margin-bottom: 15px;">🔥 Хиты продаж</h2>
                <div class="grid" id="products-grid">
                    <p style="text-align:center; grid-column:1/-1;">Загрузка...</p>
                </div>
            </div>
            <div id="screen-cart" class="screen">
                <h2 style="margin-bottom: 15px;">Корзина</h2>
                <div id="cart-list"></div>
                <div style="display:flex; justify-content:space-between; font-size:20px; font-weight:bold; margin:20px 0;">
                    <span>Итого:</span><span id="cart-total" style="color:var(--primary);">0 ₽</span>
                </div>
                <button class="btn btn-primary" onclick="goToCheckout()">Оформить</button>
            </div>
            <div id="screen-checkout" class="screen">
                <h2 style="margin-bottom: 15px;">Оформление</h2>
                <div class="input-group">
                    <label>Имя</label>
                    <input type="text" id="c-name" placeholder="Иван">
                </div>
                <div class="input-group">
                    <label>Телефон</label>
                    <input type="tel" id="c-phone" placeholder="+7 (999) 000-00-00" oninput="formatPhone(this)">
                </div>
                <div style="display:flex; justify-content:space-between; font-size:20px; font-weight:bold; margin:20px 0;">
                    <span>К оплате:</span><span id="c-total" style="color:var(--primary);">0 ₽</span>
                </div>
                <button class="btn btn-primary" onclick="submitOrder()">Подтвердить</button>
            </div>
            <div id="screen-success" class="screen" style="text-align: center; margin-top: 50px;">
                <div style="font-size: 60px; margin-bottom: 20px;">✅</div>
                <h2>Заказ оформлен!</h2>
            </div>
        </div>
        <div class="bottom-nav" id="nav">
            <div class="nav-item active" onclick="switchTab('home', this)"><span class="nav-icon">🏠</span>Главная</div>
            <div class="nav-item" onclick="switchTab('cart', this)"><span class="nav-icon">🛒</span>Корзина</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        // 1. Проверка возраста
        function verifyAge() {
            document.getElementById('age-gate').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            localStorage.setItem('galleon_age', 'true');
        }
        if (localStorage.getItem('galleon_age') === 'true') {
            document.getElementById('age-gate').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
        }

        // 2. Загрузка товаров
        let products = [];
        let cart = [];

        async function loadProducts() {
            try {
                const res = await fetch(`https://caxopok4ek-design.github.io/bot_shop/products.json?t=${Date.now()}`);
                if (!res.ok) throw new Error('Не найдено');
                products = await res.json();
                renderProducts();
            } catch (e) {
                document.getElementById('products-grid').innerHTML = `<p style="color:red; grid-column:1/-1; text-align:center;">${e.message}</p>`;
            }
        }

        function renderProducts() {
            const html = products.map(p => {
                let img = p.img && p.img.startsWith('assets/') ? `<img src="https://caxopok4ek-design.github.io/bot_shop/${p.img}">` : (p.img || '📦');
                return `
                <div class="card">
                    <div class="card-img">${img}</div>
                    <div class="card-title">${p.title}</div>
                    <div class="card-price">${p.price} ₽</div>
                    <button class="btn-add" onclick="addToCart(${p.id})">В корзину</button>
                </div>`;
            }).join('');
            document.getElementById('products-grid').innerHTML = html;
        }

        // 3. Корзина
        function addToCart(id) {
            const p = products.find(x => x.id === id);
            const exist = cart.find(x => x.id === id);
            if (exist) exist.qty++;
            else cart.push({ ...p, qty: 1 });
            if(tg) tg.HapticFeedback.impactOccurred('light');
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + tab).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(el) el.classList.add('active');
            if(tab === 'cart') renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            if(cart.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#888;">Пусто</p>';
                document.getElementById('cart-total').innerText = '0 ₽';
                return;
            }
            let total = 0;
            list.innerHTML = cart.map((item, i) => {
                total += item.price * item.qty;
                return `<div class="cart-item">
                    <div class="cart-img">${item.img && !item.img.startsWith('assets/') ? item.img : '📦'}</div>
                    <div style="flex:1;"><b>${item.title}</b><br><span style="color:var(--primary)">${item.price} ₽</span></div>
                    <div>
                        <button onclick="changeQty(${i}, -1)" style="padding:5px;">-</button>
                        <span style="margin:0 10px;">${item.qty}</span>
                        <button onclick="changeQty(${i}, 1)" style="padding:5px;">+</button>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('cart-total').innerText = total + ' ₽';
            document.getElementById('c-total').innerText = total + ' ₽';
        }

        function changeQty(i, d) {
            cart[i].qty += d;
            if(cart[i].qty <= 0) cart.splice(i, 1);
            renderCart();
        }

        function goToCheckout() {
            if(cart.length === 0) return alert('Пусто!');
            switchTab('checkout');
        }

        // 4. Отправка
        function formatPhone(input) {
            let val = input.value.replace(/\D/g, '');
            if (!val) { input.value = ''; return; }
            if (val[0] === '8') val = '7' + val.slice(1);
            if (val[0] !== '7') val = '7' + val;
            let res = '+7';
            if (val.length > 1) res += ' (' + val.slice(1, 4);
            if (val.length >= 4) res += ') ' + val.slice(4, 7);
            if (val.length >= 7) res += '-' + val.slice(7, 9);
            if (val.length >= 9) res += '-' + val.slice(9, 11);
            input.value = res;
        }

        function submitOrder() {
            const name = document.getElementById('c-name').value.trim();
            const phone = document.getElementById('c-phone').value.trim();
            if (!name || phone.length < 10) return alert('Заполните данные!');

            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const payload = {
                orderId: Math.floor(Math.random() * 900000) + 100000,
                items: cart.map(i => ({ id: i.id, title: i.title, price: i.price, qty: i.qty, img: i.img })),
                total: total,
                name: name,
                phone: phone
            };

            if (tg) {
                tg.sendData(JSON.stringify(payload));
            } else {
                alert("Тест на ПК!");
            }
            cart = [];
            switchTab('home');
        }

        // Запуск
        loadProducts();
    </script>
</body>
</html>
