<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GALLEON UK</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg-color: #121212; --surface: #1e1e1e; --text-main: #fff; --text-muted: #9e9e9e; --accent-main: #ff6b4a; --accent-glow: rgba(255, 107, 74, 0.4); --border-radius: 16px; --border-radius-sm: 12px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .hidden { display: none !important; }
        .flex { display: flex; } .items-center { align-items: center; } .justify-between { justify-content: space-between; } .justify-center { justify-content: center; }
        ::-webkit-scrollbar { width: 0; height: 0; }
        #age-gate { position: fixed; inset: 0; background: var(--bg-color); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        .logo-circle { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #ff9a76, #ff4b2b); display: flex; align-items: center; justify-content: center; font-size: 50px; margin-bottom: 20px; }
        .btn { width: 100%; padding: 16px; border-radius: var(--border-radius); border: none; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: linear-gradient(90deg, #ff4b2b, #ff6b4a); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid #333; color: var(--text-main); }
        #app { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .content-area { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 100px; }
        .screen { display: none; } .screen.active { display: block; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .product-card { background: var(--surface); border-radius: var(--border-radius); padding: 12px; display: flex; flex-direction: column; }
        .product-img { width: 100%; height: 140px; border-radius: var(--border-radius-sm); background: #111; object-fit: cover; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .product-title { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
        .product-price { font-size: 18px; font-weight: 900; margin-bottom: 10px; }
        .btn-buy { width: 100%; padding: 10px; border-radius: 8px; background: var(--accent-main); color: #fff; border: none; font-weight: bold; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: rgba(18, 18, 18, 0.95); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 10px; gap: 4px; cursor: pointer; }
        .nav-item.active { color: var(--accent-main); }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
        .input-group input { width: 100%; background: #0a0a0a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; font-size: 15px; outline: none; }
    </style>
</head>
<body>
    <div id="age-gate">
        <div class="logo-circle">⚓</div>
        <h1 style="font-size: 24px; font-weight: 900; margin-bottom: 10px;">GALLEON UK</h1>
        <p style="color: var(--text-muted); margin-bottom: 30px;">Вам есть 18 лет?</p>
        <button class="btn btn-primary" onclick="verifyAge(true)">Да, мне есть 18 лет</button>
        <button class="btn btn-outline" onclick="verifyAge(false)">Нет, мне меньше 18</button>
    </div>

    <div id="app" class="hidden">
        <div class="top-bar">
            <h1 style="font-size: 20px; font-weight: 900;">⚓ GALLEON</h1>
        </div>

        <div class="content-area">
            <!-- Главная -->
            <div id="screen-home" class="screen active">
                <h2 style="margin-bottom: 15px;">🔥 Хиты продаж</h2>
                <div class="grid-2" id="home-products"></div>
            </div>

            <!-- Корзина -->
            <div id="screen-cart" class="screen">
                <h2 style="margin-bottom: 15px;">Корзина</h2>
                <div id="cart-list"></div>
                <div style="margin-top: 20px; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between;">
                    <span>Итого:</span><span id="cart-total">0 ₽</span>
                </div>
                <button class="btn btn-primary" style="margin-top: 15px;" onclick="goToCheckout()">Оформить заказ</button>
            </div>

            <!-- Оформление -->
            <div id="screen-checkout" class="screen">
                <h2 style="margin-bottom: 15px;">Оформление</h2>
                <div class="input-group">
                    <label>Ваше имя</label>
                    <input type="text" id="checkout-name" placeholder="Иван">
                </div>
                <div class="input-group">
                    <label>Телефон</label>
                    <input type="tel" id="checkout-phone" placeholder="+7 (999) 000-00-00" oninput="formatPhone(this)">
                </div>
                <div style="font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; margin: 20px 0;">
                    <span>К оплате:</span><span id="checkout-total">0 ₽</span>
                </div>
                <button class="btn btn-primary" onclick="submitOrder()">Подтвердить заказ</button>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('home', this)"><span style="font-size: 20px;">🏠</span>Главная</div>
            <div class="nav-item" onclick="switchTab('cart', this)"><span style="font-size: 20px;">🛒</span>Корзина</div>
        </div>
    </div>

    <script>
        // Инициализация Телеграма
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        function verifyAge(isAdult) {
            if (isAdult) {
                document.getElementById('age-gate').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                localStorage.setItem('galleon_age', 'true');
            } else {
                window.location.href = "https://www.google.com";
            }
        }
        if (localStorage.getItem('galleon_age') === 'true') {
            document.getElementById('age-gate').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
        }

        function formatPhone(input) {
            let val = input.value.replace(/\D/g, '');
            if (!val) { input.value = ''; return; }
            if (val[0] === '8') val = '7' + val.slice(1);
            if (val[0] !== '7') val = '7' + val;
            let res = '+7';
            if (val.length > 1) res += ' (' + val.slice(1, 4);
            if (val.length >= 4) res += ') ' + val.slice(4, 7);
            if (val.length >= 7) res += '-' + val.slice(7, 9);
            if (val.length >= 9) res += '-' + val.slice(9, 11);
            input.value = res;
        }

        // Данные
        let cart = [];
        const products = [
            { id: 1, name: "BJORN", price: 500, img: "🦇" },
            { id: 2, name: "POD SYSTEM", price: 1500, img: "💨" },
            { id: 3, name: "ЖИДКОСТЬ", price: 800, img: "💧" }
        ];

        function switchTab(tabId, element) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + tabId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(element) element.classList.add('active');
            
            if(tabId === 'cart') updateCart();
            if(tabId === 'checkout') updateCheckout();
        }

        function renderProducts() {
            const html = products.map(p => `
                <div class="product-card">
                    <div class="product-img">${p.img}</div>
                    <div class="product-title">${p.name}</div>
                    <div class="product-price">${p.price} ₽</div>
                    <button class="btn-buy" onclick="addToCart(${p.id})">В корзину</button>
                </div>
            `).join('');
            document.getElementById('home-products').innerHTML = html;
        }
        renderProducts();

        function addToCart(id) {
            const p = products.find(x => x.id === id);
            const exist = cart.find(x => x.id === id);
            if (exist) exist.qty++;
            else cart.push({ ...p, qty: 1 });
            alert('Добавлено в корзину!');
        }

        function updateCart() {
            const list = document.getElementById('cart-list');
            if (cart.length === 0) {
                list.innerHTML = '<p style="color: #888;">Корзина пуста</p>';
                document.getElementById('cart-total').innerText = '0 ₽';
                return;
            }
            let total = 0;
            list.innerHTML = cart.map(item => {
                total += item.price * item.qty;
                return `<div style="display:flex; justify-content:space-between; margin-bottom:10px; background:#222; padding:10px; border-radius:10px;">
                    <div>${item.name} x${item.qty}</div>
                    <div>${item.price * item.qty} ₽</div>
                </div>`;
            }).join('');
            document.getElementById('cart-total').innerText = total + ' ₽';
        }

        function goToCheckout() {
            if (cart.length === 0) return alert('Корзина пуста!');
            switchTab('checkout');
        }

        function updateCheckout() {
            let total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            document.getElementById('checkout-total').innerText = total + ' ₽';
        }

        // ОТПРАВКА В БОТ
        function submitOrder() {
            const name = document.getElementById('checkout-name').value.trim();
            const phone = document.getElementById('checkout-phone').value.trim();
            
            if (!name || phone.length < 10) {
                return alert('Заполните имя и телефон полностью!');
            }

            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                
                // Собираем данные
                const payload = {
                    orderId: Math.floor(Math.random() * 900000) + 100000,
                    items: cart,
                    total: cart.reduce((s, i) => s + (i.price * i.qty), 0),
                    name: name,
                    phone: phone
                };

                try {
                    // Отправляем
                    tg.sendData(JSON.stringify(payload));
                } catch (e) {
                    alert("Ошибка Telegram: " + e.message);
                }
            } else {
                alert("Вы открыли сайт не через Telegram!");
            }
        }
    </script>
</body>
</html>
