<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smoky Mountain</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #0b0c10; color: white; -webkit-tap-highlight-color: transparent; overflow: hidden; font-family: 'Manrope', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const tg = window.Telegram?.WebApp;

        const Icons = {
            Home: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>,
            Grid: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>,
            Cart: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>,
            Heart: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>,
            User: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Plus: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Minus: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M5 12h14"/></svg>,
            Trash: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg>,
            Check: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>,
            Store: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/></svg>,
            MapPin: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>,
            Flame: ({c}) => <svg className={c} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
        };

        const FALLBACK = [{ id: 1, title: 'Тестовый товар', category: 'Жидкости', price: 500, tag: 'NEW', desc: 'Описание', img: 'https://images.unsplash.com/photo-1558397453-94826230dcb6?q=80&w=600' }];

        const ProductCard = ({ product, onQuickAdd }) => (
            <div className="bg-[#171821] rounded-2xl p-2 border border-white/5 flex flex-col shadow-sm">
                <div className="relative w-full aspect-[4/5] rounded-xl overflow-hidden bg-gray-800 mb-2">
                    <img src={product.img} className="w-full h-full object-cover" />
                    <span className="absolute top-2 left-2 bg-[#ff3b5c] text-white text-[10px] font-black px-2 py-1 rounded-md uppercase">{product.tag}</span>
                    <button onClick={() => onQuickAdd(product)} className="absolute bottom-2 right-2 w-8 h-8 bg-white text-black rounded-full flex items-center justify-center shadow-lg"><Icons.Plus c="w-5 h-5" /></button>
                </div>
                <div className="px-1 flex-1 flex flex-col justify-between">
                    <h3 className="text-xs font-bold text-white leading-tight line-clamp-2">{product.title}</h3>
                    <div className="mt-2 text-base font-black text-white">{product.price} ₽</div>
                </div>
            </div>
        );

        const App = () => {
            const [tab, setTab] = useState('home');
            const [cart, setCart] = useState([]);
            const [PRODUCTS, setProducts] = useState(FALLBACK);
            const [lastOrder, setLastOrder] = useState(null);

            // Загрузка товаров
            useEffect(() => {
                fetch('./products.json')
                    .then(r => r.json())
                    .then(data => {
                        if (Array.isArray(data) && data.length) setProducts(data);
                    })
                    .catch(e => console.log("Ошибка загрузки товаров:", e));
                
                if (tg) { tg.ready(); tg.expand(); }
            }, []);

            const quickAdd = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
                    return [...prev, { ...product, qty: 1 }];
                });
                if (tg) tg.HapticFeedback.impactOccurred('medium');
            };

            const updateQty = (id, delta) => setCart(prev => prev.map(item => item.id === id ? { ...item, qty: Math.max(0, item.qty + delta) } : item).filter(item => item.qty > 0));
            
            const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const handleCheckout = () => {
                // СБОР ДАННЫХ
                const orderId = Math.floor(100000 + Math.random() * 900000);
                const payload = {
                    orderId: orderId,
                    items: cart.map(item => ({ id: item.id, title: item.title, price: item.price, qty: item.qty })),
                    total: cartTotal,
                    phone: "+7 999 000-00-00", // Тестовый телефон для проверки
                    delivery: "Самовывоз",
                    address: "—",
                    payment: "При получении"
                };

                // ОТПРАВКА В БОТА
                if (tg && typeof tg.sendData === 'function') {
                    tg.sendData(JSON.stringify(payload));
                    setTimeout(() => { tg.close(); }, 500); // Закрываем через полсекунды
                } else {
                    alert("Ошибка: отправка доступна только из Telegram (не из браузера).");
                }

                setLastOrder(payload);
                setCart([]);
                setTab('success');
            };

            return (
                <div className="min-h-screen bg-[#0b0c10] flex justify-center">
                    <div className="w-full max-w-md h-screen relative flex flex-col">
                        
                        <div className="p-4 bg-[#0b0c10] border-b border-white/5 flex items-center gap-2">
                            <Icons.Flame c="w-6 h-6 text-[#ff3b5c]" />
                            <h1 className="text-xl font-black text-white">SMOKY</h1>
                        </div>

                        <main className="flex-1 overflow-y-auto p-4 pb-24">
                            {tab === 'home' && (
                                <div className="grid grid-cols-2 gap-3">
                                    {PRODUCTS.map(p => <ProductCard key={p.id} product={p} onQuickAdd={quickAdd} />)}
                                </div>
                            )}

                            {tab === 'cart' && (
                                <div>
                                    <h2 className="text-xl font-black mb-4 text-white">Корзина</h2>
                                    {cart.length === 0 ? (
                                        <p className="text-gray-400 text-center mt-10">Корзина пуста</p>
                                    ) : (
                                        <div className="space-y-3">
                                            {cart.map(item => (
                                                <div key={item.id} className="bg-[#171821] p-3 rounded-2xl flex gap-3 border border-white/5">
                                                    <img src={item.img} className="w-16 h-20 rounded-lg object-cover" />
                                                    <div className="flex-1 flex flex-col justify-between">
                                                        <h4 className="text-sm font-bold text-white line-clamp-1">{item.title}</h4>
                                                        <div className="flex items-center justify-between mt-2">
                                                            <span className="text-[#ff3b5c] font-black">{item.price} ₽</span>
                                                            <div className="flex items-center gap-2">
                                                                <button onClick={() => updateQty(item.id, -1)} className="w-6 h-6 bg-black/30 rounded flex items-center justify-center text-white"><Icons.Minus c="w-3 h-3"/></button>
                                                                <span className="text-white text-sm">{item.qty}</span>
                                                                <button onClick={() => updateQty(item.id, 1)} className="w-6 h-6 bg-black/30 rounded flex items-center justify-center text-white"><Icons.Plus c="w-3 h-3"/></button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                            <div className="bg-[#171821] p-4 rounded-2xl border border-white/5 mt-4">
                                                <div className="flex justify-between text-white font-black text-lg mb-4">
                                                    <span>Итого:</span>
                                                    <span>{cartTotal} ₽</span>
                                                </div>
                                                <button onClick={handleCheckout} className="w-full bg-[#ff3b5c] text-white py-3 rounded-xl font-bold text-lg">Оформить заказ</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {tab === 'success' && (
                                <div className="text-center mt-20">
                                    <div className="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <Icons.Check c="w-10 h-10 text-green-500" />
                                    </div>
                                    <h2 className="text-2xl font-black text-white mb-2">Заказ отправлен!</h2>
                                    <p className="text-gray-400 text-sm mb-6">Номер: #{lastOrder?.id}</p>
                                    <button onClick={() => setTab('home')} className="bg-white text-black px-6 py-2 rounded-xl font-bold">На главную</button>
                                </div>
                            )}
                        </main>

                        <div className="absolute bottom-0 w-full bg-[#171821] border-t border-white/5 flex justify-around p-3 pb-6">
                            <button onClick={() => setTab('home')} className={`flex flex-col items-center gap-1 ${tab === 'home' ? 'text-[#ff3b5c]' : 'text-gray-500'}`}><Icons.Home c="w-6 h-6" /><span className="text-[10px] font-bold">Главная</span></button>
                            <button onClick={() => setTab('cart')} className={`flex flex-col items-center gap-1 relative ${tab === 'cart' ? 'text-[#ff3b5c]' : 'text-gray-500'}`}>
                                <Icons.Cart c="w-6 h-6" />
                                <span className="text-[10px] font-bold">Корзина</span>
                                {cart.length > 0 && <span className="absolute -top-1 -right-2 bg-[#ff3b5c] text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">{cart.reduce((s,i)=>s+i.qty,0)}</span>}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
