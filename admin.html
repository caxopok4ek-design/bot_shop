<!DOCTYPE html>
<html lang="ru">
<head>

<title>GALLEON Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ... (ВСТАВЬ СЮДА ВСЕ СТИЛИ ИЗ ПРЕДЫДУЩЕГО СООБЩЕНИЯ) ... */
</style>
</head>
<body>
<div id="app">
  <div id="screen"><div style="padding:50px; text-align:center;">Загрузка данных...</div></div>
  <nav class="nav" id="nav"></nav>
</div>

<script>
const ADMIN_PASSWORD = "4847"; 
const tg = window.Telegram?.WebApp;

if (tg) { tg.ready(); tg.expand(); }

let state = {
  currentTab: 'home',
  screen: 'home',
  screenData: null,
  ordersTab: 'new',
  orders: [],
  products: []
};

// ЗАПРОС ДАННЫХ У БОТА ПРИ ЗАГРУЗКЕ
if (tg) {
    tg.sendData(JSON.stringify({ action: "admin_panel", command: "get_data" }));
} else {
    document.getElementById('screen').innerHTML = '<div class="empty">Откройте через Telegram!</div>';
}

// Эта функция ловит ответ от бота (в Telegram WebApp нет прямого события для этого, 
// поэтому мы используем хак через location.hash, если бот передает данные)
window.addEventListener('message', function(event) {
    try {
        let data = JSON.parse(event.data);
        if (data.orders) {
            state.orders = data.orders;
            state.products = data.products;
            render(); // Перерисовываем экран с новыми данными
        }
    } catch(e) {}
});
