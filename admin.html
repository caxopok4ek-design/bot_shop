<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Smoky Admin — прототип</title>
<style>
  :root{
    --bg:#0a0a0c; --surface:#16161a; --surface2:#1f1f24; --surface3:#26262d;
    --border:#2a2a30; --text:#f5f5f7; --muted:#8a8a94; --muted2:#5a5a64;
    --accent:#ff3b5c; --accent-dim:#ff3b5c33;
    --green:#33d17a; --yellow:#f5c542; --red:#ff3b5c; --gray:#6b6b76;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:#050506;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    color:var(--text);
    display:flex; justify-content:center;
    min-height:100vh;
  }
  #app{
    width:100%; max-width:430px; min-height:100vh;
    background:var(--bg);
    display:flex; flex-direction:column;
    position:relative;
    box-shadow:0 0 40px rgba(0,0,0,.6);
  }
  .header{
    position:sticky; top:0; z-index:50;
    background:rgba(10,10,12,.92);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    padding:14px 16px;
    display:flex; align-items:center; gap:12px;
    border-bottom:1px solid var(--border);
    min-height:56px;
  }
  .header .back{
    background:none; border:none; color:var(--text); font-size:20px;
    padding:4px 8px 4px 0; cursor:pointer;
  }
  .header .title{font-size:17px; font-weight:700; flex:1;}
  .header .brand{font-size:15px; font-weight:800; letter-spacing:.5px; flex:1;}
  .header .brand span{color:var(--accent);}
  .header .right{display:flex; align-items:center; gap:10px;}
  .avatar{
    width:32px; height:32px; border-radius:50%;
    background:linear-gradient(135deg,#ff3b5c,#a02040);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700;
  }
  .icon-btn{
    background:var(--surface2); border:none; color:var(--text);
    width:36px; height:36px; border-radius:10px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .btn-add{
    background:var(--accent); color:#fff; border:none;
    padding:8px 14px; border-radius:10px; font-weight:700; font-size:13px;
    cursor:pointer;
  }
  .content{flex:1; padding:16px; padding-bottom:96px; overflow-y:auto;}
  .nav{
    position:fixed; bottom:0; left:0; right:0;
    max-width:430px; margin:0 auto;
    background:rgba(16,16,20,.96);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--border);
    display:flex; padding:8px 0 calc(8px + env(safe-area-inset-bottom));
    z-index:60;
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--muted2); font-size:10px; font-weight:600;
    cursor:pointer; padding:4px; position:relative;
  }
  .nav-item .ico{font-size:20px; line-height:1;}
  .nav-item.active{color:var(--accent);}
  .nav-item .dot{
    position:absolute; top:2px; right:calc(50% - 16px);
    width:8px; height:8px; border-radius:50%; background:var(--accent);
    border:2px solid var(--bg);
  }
  .card{
    background:var(--surface); border-radius:var(--radius);
    padding:14px; border:1px solid var(--border);
  }
  .card + .card{margin-top:10px;}
  .card.clickable{cursor:pointer; transition:background .15s;}
  .card.clickable:active{background:var(--surface2);}
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .tile{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:14px;
  }
  .tile .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; font-weight:600;}
  .tile .val{font-size:26px; font-weight:800; margin:6px 0 2px; letter-spacing:-.5px;}
  .tile .sub{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:4px;}
  .tile .up{color:var(--green);}
  .tile .warn{color:var(--accent);}
  .tile.wide{grid-column:span 2;}
  .section-title{
    font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px;
    font-weight:700; margin:22px 0 10px;
  }
  .section-title:first-child{margin-top:0;}
  .order-row{display:flex; flex-direction:column; gap:6px; position:relative;}
  .order-top{display:flex; align-items:center; gap:8px; font-size:12px;}
  .order-num{font-weight:700; color:var(--text);}
  .status-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .status-dot.new{background:var(--red); box-shadow:0 0 8px var(--red);}
  .status-dot.work{background:var(--yellow);}
  .status-dot.done{background:var(--green);}
  .status-dot.cancel{background:var(--gray);}
  .status-txt{font-weight:600;}
  .status-txt.new{color:var(--red);}
  .status-txt.work{color:var(--yellow);}
  .status-txt.done{color:var(--green);}
  .status-txt.cancel{color:var(--gray);}
  .order-time{margin-left:auto; color:var(--muted); font-size:11px;}
  .order-name{font-size:15px; font-weight:600;}
  .order-phone{font-size:13px; color:var(--muted);}
  .order-meta{font-size:12px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap;}
  .order-meta .price{color:var(--text); font-weight:700;}
  .order-promo{font-size:11px; color:var(--accent); font-weight:600;}
  .tabs{display:flex; gap:8px; overflow-x:auto; padding:4px 0; margin-bottom:14px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    background:var(--surface); border:1px solid var(--border);
    color:var(--muted); padding:8px 14px; border-radius:20px;
    font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer;
    transition:all .15s;
  }
  .tab.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .tab .cnt{
    background:rgba(255,255,255,.15); padding:1px 6px; border-radius:8px;
    font-size:11px; margin-left:4px;
  }
  .tab.active .cnt{background:rgba(0,0,0,.2);}
  .btn{
    border:none; border-radius:12px; padding:13px 18px;
    font-weight:700; font-size:14px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:active{background:#e02c4c;}
  .btn-ghost{background:var(--surface2); color:var(--text);}
  .btn-danger{background:var(--accent-dim); color:var(--accent); border:1px solid var(--accent);}
  .btn-success{background:var(--green); color:#042; font-weight:800;}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 12px; font-size:12px; border-radius:10px;}
  .btn-row{display:flex; gap:10px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:600;}
  .input{
    width:100%; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:12px 14px; color:var(--text);
    font-size:14px; font-family:inherit; outline:none;
  }
  .input:focus{border-color:var(--accent);}
  textarea.input{resize:vertical; min-height:70px;}
  .input-row{display:flex; gap:8px;}
  .input-row .input{flex:1;}
  .input-suffix{
    display:flex; align-items:center; background:var(--surface);
    border:1px solid var(--border); border-radius:10px; padding-right:14px;
    color:var(--muted); font-weight:600;
  }
  .input-suffix .input{border:none; background:none;}
  .segmented{
    display:flex; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:3px; gap:3px;
  }
  .segmented button{
    flex:1; background:none; border:none; color:var(--muted);
    padding:9px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .segmented button.active{background:var(--surface3); color:var(--text);}
  .chart{
    height:80px; display:flex; align-items:flex-end; gap:6px; padding:8px 0;
  }
  .chart .bar{
    flex:1; border-radius:4px 4px 0 0; min-height:6px; transition:opacity .15s;
    cursor:pointer; position:relative;
  }
  .chart .bar:hover{opacity:.75;}
  .chart .bar .val{
    position:absolute; top:-18px; left:0; right:0; text-align:center;
    font-size:11px; font-weight:700; color:var(--muted);
  }
  .chart-labels{
    display:flex; gap:6px; margin-top:6px; font-size:10px;
  }
  .chart-labels span{flex:1; text-align:center; color:var(--muted);}
  .promo-code{
    font-family:"SF Mono",Consolas,monospace; font-size:15px; font-weight:800;
    letter-spacing:1px;
  }
  .promo-discount{color:var(--accent); font-weight:800; margin-left:auto;}
  .promo-status{font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px;}
  .promo-status.active{background:rgba(51,209,122,.15); color:var(--green);}
  .promo-status.expired{background:rgba(107,107,118,.15); color:var(--gray);}
  .promo-status.off{background:rgba(255,59,92,.15); color:var(--accent);}
  .product-row{display:flex; gap:12px; align-items:center;}
  .product-img{
    width:52px; height:52px; border-radius:10px; background:var(--surface2);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0; border:1px solid var(--border);
  }
  .product-info{flex:1; min-width:0;}
  .product-name{font-weight:600; font-size:14px; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .product-meta{font-size:12px; color:var(--muted);}
  .toggle{
    width:38px; height:22px; border-radius:11px; background:var(--surface3);
    position:relative; cursor:pointer; transition:background .15s; flex-shrink:0;
    border:none;
  }
  .toggle::after{
    content:""; position:absolute; width:16px; height:16px; border-radius:50%;
    background:#fff; top:3px; left:3px; transition:left .15s;
  }
  .toggle.on{background:var(--green);}
  .toggle.on::after{left:19px;}
  .photo-box{
    width:100%; aspect-ratio:1; background:var(--surface2);
    border:2px dashed var(--border); border-radius:var(--radius);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; color:var(--muted); cursor:pointer; margin-bottom:16px;
    overflow:hidden;
  }
  .photo-box img{width:100%; height:100%; object-fit:cover;}
  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    background:var(--surface2); border:1px solid var(--border);
    color:var(--muted); padding:8px 14px; border-radius:20px;
    font-size:13px; font-weight:600; cursor:pointer;
  }
  .chip.on{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}
  .stat-line{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-bottom:1px solid var(--border); font-size:14px;
  }
  .stat-line:last-child{border-bottom:none;}
  .bar-progress{
    height:8px; background:var(--surface3); border-radius:4px; overflow:hidden;
    margin-top:6px;
  }
  .bar-progress > div{height:100%; background:var(--accent); border-radius:4px;}
  .muted{color:var(--muted);}
  .accent{color:var(--accent);}
  .success{color:var(--green);}
  .divider{height:1px; background:var(--border); margin:14px 0;}
  .empty{
    text-align:center; padding:60px 20px; color:var(--muted);
    font-size:14px;
  }
  .empty .ico{font-size:42px; margin-bottom:12px; opacity:.5;}
  .row-actions{display:flex; gap:8px; margin-top:10px;}
  .kv{display:flex; gap:10px; font-size:14px; padding:7px 0; align-items:center;}
  .kv .k{color:var(--muted); min-width:24px;}
  .kv .v{flex:1;}
  .kv .act{color:var(--accent); font-size:12px; font-weight:700; cursor:pointer; background:none; border:none;}
  .order-item-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;
  }
  .order-item-row:last-child{border-bottom:none;}
  .order-item-row .oimg{width:32px; height:32px; border-radius:6px; background:var(--surface2);
    display:flex; align-items:center; justify-content:center; font-size:16px;}
  .order-item-row .oname{flex:1;}
  .order-item-row .oprice{font-weight:700;}
  .order-item-row .oqty{color:var(--muted); font-size:12px;}
  .total-row{display:flex; justify-content:space-between; padding:6px 0; font-size:13px;}
  .total-row.grand{font-size:16px; font-weight:800; padding-top:10px; margin-top:6px; border-top:1px solid var(--border);}
  .status-banner{
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    border-radius:12px; background:var(--surface); border:1px solid var(--border);
  }
  .status-banner .st{font-weight:700; font-size:14px;}
  .status-banner .actions{margin-left:auto; display:flex; gap:8px;}
  .sheet{position:fixed; inset:0; z-index:200;}
  .sheet-bg{position:absolute; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(4px);}
  .sheet-panel{
    position:absolute; bottom:0; left:0; right:0; max-width:430px; margin:0 auto;
    background:var(--surface2); border-radius:20px 20px 0 0; padding:16px;
    padding-bottom:calc(16px + env(safe-area-inset-bottom));
    animation:slideUp .2s;
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet-title{font-size:16px; font-weight:700; margin-bottom:4px;}
  .sheet-sub{font-size:13px; color:var(--muted); margin-bottom:14px;}
  .sheet-item{
    padding:14px; border-radius:12px; background:var(--surface3);
    margin-bottom:8px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; gap:12px; font-size:14px;
    border:none; color:var(--text); width:100%; text-align:left;
  }
  .sheet-item:active{background:var(--surface);}
  .sheet-item.danger{color:var(--accent);}
  .sheet-item.cancel{background:transparent; border:1px solid var(--border); justify-content:center; margin-top:8px;}
  .demo-badge{
    display:inline-block; font-size:9px; font-weight:700; letter-spacing:.5px;
    background:var(--surface3); color:var(--muted); padding:2px 6px;
    border-radius:4px; margin-left:6px; vertical-align:middle;
    text-transform:uppercase;
  }
</style>
</head>

<script>
// ====================== STATE ======================
const state = {

    {id:482909, name:'Ольга М.', phone:'+7 903 555-66-77', tg:'@olga_m', uid:'8488865566',

     status:'done', time:'2 часа назад', method:'Встреча', place:'ТЦ Галерея, 2 этаж',
     pay:'Онлайн', promo:'', promoDisc:0, comment:'',

  ],

    {id:1, img:'🧴', name:'Жидкость Mango Ice', price:500, oldPrice:700, cat:'Жидкости', stock:24, on:true, tags:['HIT'], desc:'Сочный манго со льдом'},

    {code:'OLDCODE', type:'percent', value:15, uses:3, limit:100, until:'01.01.2026', status:'off'}
  ]
};

let productFilter = 'Все';
let promoTab = 'active';
let statsPeriod = 'week';

// ====================== HELPERS ======================
const $ = (s,el=document) => el.querySelector(s);
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => n.toLocaleString('ru-RU') + ' ₽';
const orderSubtotal = o => o.items.reduce((s,i)=>s+i.qty*i.price,0);
const orderTotal = o => orderSubtotal(o) - (o.promoDisc||0);
const orderCount = o => o.items.reduce((s,i)=>s+i.qty,0);
const fmtStatus = s => ({new:'Новый',work:'В работе',done:'Выполнен',cancel:'Отменён'}[s]);
const statusColor = s => ({new:'var(--red)',work:'var(--yellow)',done:'var(--green)',cancel:'var(--gray)'}[s]);

function newOrdersCount(){ return state.orders.filter(o=>o.status==='new').length; }
function workOrdersCount(){ return state.orders.filter(o=>o.status==='work').length; }
function activeOrdersCount(){ return state.orders.filter(o=>o.status==='new'||o.status==='work').length; }

// --- Single source of truth ---
function getStats(period){
  const doneOrders = state.orders.filter(o => o.status === 'done');
  const totalOrders = state.orders.length;
  const cancelledCount = state.orders.filter(o => o.status === 'cancel').length;
  const dayRevenue = doneOrders.reduce((s,o) => s + orderTotal(o), 0);
  const avgTicket = doneOrders.length > 0 ? Math.round(dayRevenue / doneOrders.length) : 0;
  const cancelRate = totalOrders > 0 ? cancelledCount / totalOrders : 0;
  const doneRate = totalOrders > 0 ? doneOrders.length / totalOrders : 0;

  if (period === 'day') {
    return {
      revenue: dayRevenue,
      orders: totalOrders,
      avg: avgTicket,
      done: doneOrders.length,
      cancelled: cancelledCount,
      cancelRate
    };
  }

  // Demo-scaling для других периодов (реальных исторических данных нет)
  const factor = {week:7, month:30, year:365}[period];
  const revVar = {week:0.85, month:0.9, year:1.05}[period];
  const ordVar = {week:0.72, month:0.82, year:0.95}[period];

  const orders = Math.round(totalOrders * factor * ordVar);
  const revenue = Math.round(dayRevenue * factor * revVar);

  return {
    revenue,
    orders,
    avg: avgTicket,
    done: Math.round(orders * doneRate),
    cancelled: Math.round(orders * cancelRate),
    cancelRate
  };
}

function getStatusBreakdown(){
  return {
    new: state.orders.filter(o=>o.status==='new').length,
    work: state.orders.filter(o=>o.status==='work').length,
    done: state.orders.filter(o=>o.status==='done').length,
    cancel: state.orders.filter(o=>o.status==='cancel').length
  };
}

function getTopProducts(){
  const validOrders = state.orders.filter(o => o.status !== 'cancel');
  const agg = {};
  validOrders.forEach(o => {
    o.items.forEach(i => {
      if (!agg[i.name]) agg[i.name] = {name: i.name, img: i.img, qty: 0, revenue: 0};
      agg[i.name].qty += i.qty;
      agg[i.name].revenue += i.qty * i.price;
    });
  });
  return Object.values(agg).sort((a,b) => b.revenue - a.revenue);
}

function getDeliveryBreakdown(){
  const validOrders = state.orders.filter(o => o.status !== 'cancel');
  const total = validOrders.length;
  if (total === 0) return {total:0, pickup:0, meeting:0, pickupPct:0, meetingPct:0};
  const meeting = validOrders.filter(o => o.method === 'Встреча').length;
  const pickup = total - meeting;
  return {
    total, pickup, meeting,
    pickupPct: Math.round(pickup / total * 100),
    meetingPct: Math.round(meeting / total * 100)
  };
}

function toggleTag(id, tag, el){
  el.classList.toggle('on');
  const p = state.products.find(x=>x.id===id);
  if(!p) return;
  if(p.tags.includes(tag)) p.tags = p.tags.filter(t=>t!==tag);
  else p.tags.push(tag);
}
function deleteProduct(id){
  if(!confirm('Удалить товар?')) return;
  state.products = state.products.filter(x=>x.id!==id);
  goTab('products');
  toast('Товар удалён');
}
function saveProduct(id){
  const name = $('#pName')?.value || 'Новый товар';
  const price = parseInt($('#pPrice')?.value) || 0;
  const oldPrice = parseInt($('#pOldPrice')?.value) || 0;
  const stock = parseInt($('#pStock')?.value) || 0;
  const desc = $('#pDesc')?.value || '';
  const cat = $('#pCat')?.value || 'Жидкости';
  const on = $('#pOn')?.classList.contains('on') ?? true;

  if(id){
    const p = state.products.find(x=>x.id===id);
    if(p) Object.assign(p, {name, price, oldPrice, stock, desc, cat, on});
    toast('Сохранено');
  } else {
    state.products.push({
      id: Date.now(), img:'📷', name, price, oldPrice, stock, desc, cat, on, tags:[]
    });
    toast('Товар добавлен');
  }
  setTimeout(()=>goTab('products'), 400);
}
function handlePhoto(input){
  if(input.files && input.files[0]){
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
      const box = document.querySelector('.photo-box');
      if(box) box.innerHTML = `<img src="${e.target.result}" alt="фото">`;
      toast('Фото загружено');
    };
    reader.readAsDataURL(file);
  }
}

          <div style="font-size:12px; color:var(--muted);">${p.uses} использований</div>
          <div style="font-size:12px; color:var(--muted); margin-top:2px;">
            ${p.until?`до ${p.until}`:'без срока'} · ${p.limit?`лимит ${p.limit}`:'без лимита'}
          </div>
        </div>
      `).join('') : `<div class="empty"><div class="ico">🎟</div>Промокодов нет</div>`}
    </div>
  `;
}
function setPromoTab(t){ promoTab=t; render(); }
function showPromoMenu(code){
  const p = state.promos.find(x=>x.code===code);
  if(!p) return;
  openSheet(`
    <div class="sheet-title">${p.code}</div>
    <div class="sheet-sub">${p.type==='percent'?'-'+p.value+'%':'-'+p.value+'₽'} · ${p.uses} использований</div>
    <button class="sheet-item" onclick="closeSheet(); copyCode('${p.code}')">📋 Скопировать код</button>
    <button class="sheet-item" onclick="closeSheet(); togglePromoStatus('${p.code}')">
      ${p.status==='active'?'⏸ Отключить':'▶ Включить'}
    </button>
    <button class="sheet-item danger" onclick="closeSheet(); deletePromo('${p.code}')">🗑 Удалить</button>
    <button class="sheet-item cancel" onclick="closeSheet()">Закрыть</button>
  `);
}
function copyCode(c){
  navigator.clipboard?.writeText(c);
  toast('Код '+c+' скопирован');
}
function togglePromoStatus(code){
  const p = state.promos.find(x=>x.code===code);
  if(!p) return;
  p.status = p.status==='active' ? 'off' : 'active';
  render();
  toast(p.status==='active'?'Включён':'Отключён');
}
function deletePromo(code){
  if(!confirm('Удалить промокод '+code+'?')) return;
  state.promos = state.promos.filter(x=>x.code!==code);
  render();
  toast('Промокод удалён');
}

// ====================== SCREEN: PROMO NEW ======================
function renderPromoNew(){
  const isPercent = state.promoFormType==='percent';
  return `
    <div class="header">
      <button class="back" onclick="goBack()">←</button>
      <div class="title">Новый промокод</div>
    </div>
    <div class="content">
      <div class="field"><label>Код</label>
        <div class="input-row">
          <input class="input" id="promoCode" placeholder="SMOKY20">
          <button class="btn btn-ghost" onclick="randCode()">🎲</button>
        </div>
      </div>

      <div class="field"><label>Тип скидки</label>
        <div class="segmented">
          <button class="${isPercent?'active':''}" onclick="setPromoType('percent')">Процент %</button>
          <button class="${!isPercent?'active':''}" onclick="setPromoType('fixed')">Фикс. сумма ₽</button>
        </div>
      </div>

      <div class="field"><label>Размер скидки</label>
        <div class="input-suffix">
          <input class="input" id="promoValue" type="number" placeholder="${isPercent?'20':'500'}">
          <span>${isPercent?'%':'₽'}</span>
        </div>
      </div>

      <div class="field"><label>Минимальная сумма заказа (опционально)</label>
        <div class="input-suffix"><input class="input" type="number" placeholder="1000"><span>₽</span></div>
      </div>

      <div class="field"><label>Срок действия</label>
        <input class="input" type="text" placeholder="01.03.2026 (или пусто — без срока)">
      </div>

      <div class="field"><label>Лимит активаций</label>
        <input class="input" id="promoLimit" type="number" placeholder="50 (или пусто — без лимита)">
      </div>

      <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="createPromo()">СОЗДАТЬ</button>
    </div>
  `;
}
function setPromoType(t){ state.promoFormType=t; render(); }
function randCode(){
  const codes = ['SMOKY','VAPE','FIRE','ICE','BLACK','RED','POD','PUFF'];
  const c = codes[Math.floor(Math.random()*codes.length)] + Math.floor(Math.random()*90+10);
  $('#promoCode').value = c;
  toast('Сгенерировано: '+c);
}
function createPromo(){
  const code = ($('#promoCode')?.value||'').trim().toUpperCase();
  if(!code){ toast('Введи код'); return; }
  if(state.promos.some(p=>p.code===code)){ toast('Такой код уже есть'); return; }
  const value = parseInt($('#promoValue')?.value) || (state.promoFormType==='percent'?10:500);
  const limit = parseInt($('#promoLimit')?.value) || 0;
  state.promos.unshift({
    code, type:state.promoFormType, value, uses:0, limit,
    until:'01.03.2026', status:'active'
  });
  toast('Промокод создан');
  setTimeout(()=>goTab('promos'), 400);
}

// ====================== SCREEN: STATS ======================
function renderStats(){
  const stats = getStats(statsPeriod);
  const bd = getStatusBreakdown();
  const top = getTopProducts();
  const delivery = getDeliveryBreakdown();
  const maxBd = Math.max(bd.new, bd.work, bd.done, bd.cancel, 1);
  const cancelRate = (stats.cancelRate * 100).toFixed(1);
  const periodName = {day:'сегодня', week:'за неделю', month:'за месяц', year:'за год'}[statsPeriod];
  const approx = statsPeriod === 'day' ? '' : '≈ ';
  const isDemoScale = statsPeriod !== 'day';

  const barColors = {new:'var(--red)', work:'var(--yellow)', done:'var(--green)', cancel:'var(--gray)'};

  return `
    <div class="header">
      <div class="title">Статистика</div>
    </div>
    <div class="content">
      <div class="tabs">
        ${[['day','День'],['week','Неделя'],['month','Месяц'],['year','Год']].map(([k,l])=>
          `<button class="tab ${statsPeriod===k?'active':''}" onclick="setStatsPeriod('${k}')">${l}</button>`
        ).join('')}
      </div>

      <div class="tiles">
        <div class="tile">
          <div class="lbl">Выручка</div>
          <div class="val" style="font-size:22px;">${approx}${money(stats.revenue)}</div>
          <div class="sub">${statsPeriod==='day'?'по '+stats.done+' выполненным':`по ${stats.done} выполненным`}</div>
        </div>
        <div class="tile">
          <div class="lbl">Заказы</div>
          <div class="val" style="font-size:22px;">${approx}${stats.orders}</div>
          <div class="sub">${periodName}${isDemoScale?' <span class="demo-badge">demo</span>':''}</div>
        </div>
        <div class="tile wide">
          <div class="lbl">Средний чек</div>
          <div class="val" style="font-size:22px;">${money(stats.avg)}</div>
          <div class="sub">по ${stats.done} выполненным</div>
        </div>
      </div>

      <div class="section-title">Заказы по статусам <span class="demo-badge">реал.</span></div>
      <div class="card">
        <div class="chart">
          ${['new','work','done','cancel'].map(k=>`
            <div class="bar" style="height:${(bd[k]/maxBd)*100}%; background:${barColors[k]}" title="${fmtStatus(k)}: ${bd[k]}">
              <div class="val">${bd[k]}</div>
            </div>
          `).join('')}
        </div>
        <div class="chart-labels">
          <span>Новые</span><span>В работе</span><span>Вып.</span><span>Отменено</span>
        </div>
      </div>

      <div class="section-title">Топ товаров <span class="demo-badge">реал.</span></div>
      <div class="card">
        ${top.length ? top.slice(0,5).map((p,i)=>`
          <div class="stat-line">
            <span>${i+1}. ${escapeHtml(p.name)}</span>
            <span class="muted">${p.qty} шт · ${money(p.revenue)}</span>
          </div>
        `).join('') : `<div class="empty" style="padding:20px;"><div class="ico">📊</div>Пока нет продаж</div>`}
      </div>

      <div class="section-title">Способы получения <span class="demo-badge">реал.</span></div>
      <div class="card">
        ${delivery.total ? `
          <div class="stat-line" style="flex-direction:column; align-items:stretch; gap:4px;">
            <div style="display:flex; justify-content:space-between;">
              <span>🏪 Самовывоз</span>
              <span class="muted">${delivery.pickup} / ${delivery.total} · ${delivery.pickupPct}%</span>
            </div>
            <div class="bar-progress"><div style="width:${delivery.pickupPct}%"></div></div>
          </div>
          <div class="stat-line" style="flex-direction:column; align-items:stretch; gap:4px; border-bottom:none;">
            <div style="display:flex; justify-content:space-between;">
              <span>🚚 Встреча</span>
              <span class="muted">${delivery.meeting} / ${delivery.total} · ${delivery.meetingPct}%</span>
            </div>
            <div class="bar-progress"><div style="width:${delivery.meetingPct}%"></div></div>
          </div>
        ` : `<div class="empty" style="padding:20px;"><div class="ico">📦</div>Нет данных</div>`}
      </div>

      <div class="section-title">Промокоды <span class="demo-badge">реал.</span></div>
      <div class="card">
        ${state.promos.filter(p=>p.uses>0).slice(0,3).map(p=>`
          <div class="stat-line"><span>${p.code}</span><span class="muted">${p.uses} раз</span></div>
        `).join('') || '<div class="stat-line muted">Нет использований</div>'}
      </div>

      <div class="card" style="margin-top:14px; background:rgba(51,209,92,.08); border-color:rgba(51,209,92,.3);">
        <div style="display:flex; justify-content:space-between; font-size:13px;">
          <span>Отмены ${periodName}</span>
          <span class="${parseFloat(cancelRate) < 5 ? 'success' : 'accent'}">
            ${cancelRate}% · ${stats.cancelled} шт
          </span>
        </div>
      </div>

      <div style="margin-top:24px; text-align:center; font-size:10px; color:var(--muted2); line-height:1.6;">
        <span class="demo-badge">demo</span> — масштабировано от сегодняшних данных (истории пока нет)<br>
        <span class="demo-badge">реал.</span> — посчитано из текущих заказов
      </div>
    </div>
  `;
}
function setStatsPeriod(p){ statsPeriod=p; render(); }

// ====================== TOAST ======================
let toastTimer;
function toast(msg){
  let t = $('#toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = `
      position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
      background:var(--surface3); color:var(--text); padding:10px 16px;
      border-radius:10px; font-size:13px; font-weight:600; z-index:100;
      box-shadow:0 4px 20px rgba(0,0,0,.5); transition:opacity .2s, bottom .2s;
      max-width:340px; text-align:center;
    `;
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  t.style.bottom = '96px';
  clearTimeout(timer);
  var timer = setTimeout(()=>{ t.style.opacity='0'; t.style.bottom='80px'; }, 1800);
}
clearTimeout(toastTimer);
toastTimer = null;

// ====================== BOOT ======================
render();
</script>
</body>
</html>
