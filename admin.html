<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GALLEON Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0a0a0c; --surface:#16161a; --surface2:#1f1f24; --surface3:#26262d;
    --border:#2a2a30; --text:#f5f5f7; --muted:#8a8a94; --accent:#ff8c68;
    --green:#4ade80; --red:#ff3b5c; --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:#050506; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    color:var(--text); display:flex; justify-content:center; min-height:100vh;
  }
  #app{
    width:100%; max-width:430px; min-height:100vh; background:var(--bg);
    display:flex; flex-direction:column; position:relative; box-shadow:0 0 40px rgba(0,0,0,.6);
  }
  .header{
    position:sticky; top:0; z-index:50; background:rgba(10,10,12,.92);
    backdrop-filter:blur(20px); padding:14px 16px; display:flex; align-items:center; gap:12px;
    border-bottom:1px solid var(--border); min-height:56px;
  }
  .header .title{font-size:17px; font-weight:700; flex:1;}
  .header .brand{font-size:15px; font-weight:800; letter-spacing:.5px; flex:1;}
  .header .brand span{color:var(--accent);}
  .header .right{display:flex; align-items:center; gap:10px;}
  .avatar{width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#ff8c68,#ff5e3a); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#000;}
  .icon-btn{background:var(--surface2); border:none; color:var(--text); width:36px; height:36px; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px;}
  .content{flex:1; padding:16px; padding-bottom:96px; overflow-y:auto;}
  .nav{position:fixed; bottom:0; left:0; right:0; max-width:430px; margin:0 auto; background:rgba(16,16,20,.96); backdrop-filter:blur(20px); border-top:1px solid var(--border); display:flex; padding:8px 0 calc(8px + env(safe-area-inset-bottom)); z-index:60;}
  .nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--muted); font-size:10px; font-weight:600; cursor:pointer; padding:4px; position:relative;}
  .nav-item .ico{font-size:20px; line-height:1;}
  .nav-item.active{color:var(--accent);}
  .card{background:var(--surface); border-radius:var(--radius); padding:14px; border:1px solid var(--border); margin-bottom:10px;}
  .tabs{display:flex; gap:8px; overflow-x:auto; padding:4px 0; margin-bottom:14px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{background:var(--surface); border:1px solid var(--border); color:var(--muted); padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer;}
  .tab.active{background:var(--accent); border-color:var(--accent); color:#000;}
  .btn{border:none; border-radius:12px; padding:13px 18px; font-weight:700; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; width:100%;}
  .btn-primary{background:var(--accent); color:#000;}
  .btn-danger{background:rgba(255,59,92,0.2); color:var(--red); border:1px solid var(--red);}
  .btn-sm{padding:8px 12px; font-size:12px; border-radius:10px; width:auto;}
  .input{width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:12px; color:#fff; font-size:14px; outline:none; margin-bottom:10px;}
  .input:focus{border-color:var(--accent);}
  .empty{text-align:center; padding:60px 20px; color:var(--muted); font-size:14px;}
</style>
</head>
<body>
<div id="app">
  <div id="screen"></div>
  <nav class="nav" id="nav"></nav>
</div>

<script>
const ADMIN_PASSWORD = "4847"; 
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let state = {
  currentTab: 'home',
  screen: 'home',
  ordersTab: 'new',
  orders: [],
  products: [],
  prizes: { daily: [], case1: [], case5: [], case10: [] },
  activeCase: 'daily'
};

async function loadData() {
    const screenEl = document.getElementById('screen');
    screenEl.innerHTML = '<div class="empty">Загрузка...</div>';
    try {
        const [resData, resPrizes] = await Promise.all([
            fetch(`panel_data.json?t=${Date.now()}`),
            fetch(`prizes.json?t=${Date.now()}`)
        ]);
        if (resData.ok) {
            const parsed = await resData.json();
            state.orders = parsed.orders || [];
            state.products = parsed.products || [];
        }
        if (resPrizes.ok) {
            state.prizes = await resPrizes.json();
        }
        render();
    } catch(e) {
        screenEl.innerHTML = '<div class="empty">Ошибка загрузки данных.</div>';
    }
}

function sendToBot(command, data = {}) {
    if (!tg) return alert("Работает только в Telegram");
    const payload = { action: "admin_panel", password: ADMIN_PASSWORD, command, ...data };
    try { tg.sendData(JSON.stringify(payload)); } catch(e) { alert("Ошибка: " + e.message); }
}

const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => n.toLocaleString('ru-RU') + ' ₽';

const tabs = [
  {id:'home', ico:'🏠', label:'Главная'},
  {id:'orders', ico:'📦', label:'Заказы'},
  {id:'products', ico:'🛒', label:'Товары'},
  {id:'prizes', ico:'🎁', label:'Кейсы'},
  {id:'promos', ico:'🎟', label:'Промо'},
];

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = tabs.map(t=>`
    <button class="nav-item ${state.currentTab===t.id?'active':''}" onclick="goTab('${t.id}')">
      <span class="ico">${t.ico}</span>
      <span>${t.label}</span>
    </button>
  `).join('');
}

function goTab(id){ state.currentTab = id; state.screen = id; render(); }

function render(){
  renderNav();
  const el = document.getElementById('screen');
  const s = state.screen;
  if(s==='home') el.innerHTML = renderHome();
  else if(s==='orders') el.innerHTML = renderOrders();
  else if(s==='products') el.innerHTML = renderProducts();
  else if(s==='prizes') el.innerHTML = renderPrizes();
  else if(s==='promos') el.innerHTML = renderPromos();
  window.scrollTo(0,0);
}

function renderHome(){
  const newO = state.orders.filter(o=>o.status==='new');
  return `
    <div class="header"><div class="brand">⚓ GALLEON <span>ADMIN</span></div><div class="right"><button class="icon-btn" onclick="loadData()">🔄</button></div></div>
    <div class="content">
      <div class="card"><b>Новые заказы:</b> ${newO.length}</div>
      <div class="card"><b>В работе:</b> ${state.orders.filter(o=>o.status==='confirmed').length}</div>
      <div class="card"><b>Выручка:</b> ${money(state.orders.reduce((s,o)=>s+(o.total||0),0))}</div>
    </div>
  `;
}

function renderOrders(){
  let filtered = state.orders.filter(o=>o.status===state.ordersTab);
  return `
    <div class="header"><div class="title">Заказы</div></div>
    <div class="content">
      <div class="tabs">
        <button class="tab ${state.ordersTab==='new'?'active':''}" onclick="setOrdersTab('new')">Новые</button>
        <button class="tab ${state.ordersTab==='confirmed'?'active':''}" onclick="setOrdersTab('confirmed')">В работе</button>
      </div>
      ${filtered.length ? filtered.map(o=>`
        <div class="card">
          <div style="display:flex; justify-content:space-between;"><b>#${o.id}</b><span>${escapeHtml(o.name)}</span></div>
          <div style="margin-top:8px;">${o.phone} · <b>${money(o.total)}</b></div>
          <div style="margin-top:10px; display:flex; gap:10px;">
            ${o.status==='new' ? `<button class="btn btn-primary btn-sm" onclick="changeBotStatus(${o.id}, 'confirmed')">Принять</button>` : ''}
            ${o.status==='confirmed' ? `<button class="btn btn-primary btn-sm" onclick="changeBotStatus(${o.id}, 'completed')">Выполнен</button>` : ''}
          </div>
        </div>
      `).join('') : `<div class="empty">Нет заказов</div>`}
    </div>
  `;
}
function setOrdersTab(t){ state.ordersTab = t; render(); }
function changeBotStatus(orderId, status) {
    sendToBot("change_status", { order_id: orderId, status: status });
    const o = state.orders.find(x=>x.id===orderId);
    if(o) o.status = status;
    render();
}

function renderProducts(){
  return `
    <div class="header"><div class="title">Товары</div></div>
    <div class="content">
      ${state.products.map(p=>`
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <b>${escapeHtml(p.name)}</b>
              <div style="font-size:12px; color:var(--muted);">${money(p.price)} · ${p.stock} шт</div>
            </div>
            <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">Удалить</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}
function deleteProduct(id) {
    if(confirm("Удалить этот товар?")) {
        sendToBot("delete_product", { id: id });
        state.products = state.products.filter(p => p.id !== id);
        render();
    }
}

function renderPrizes(){
  const cases = [
    {id:'daily', name:'Матрос'},
    {id:'case1', name:'Боцман'},
    {id:'case5', name:'Штурман'},
    {id:'case10', name:'Капитан'}
  ];
  const currentPrizes = state.prizes[state.activeCase] || [];

  return `
    <div class="header"><div class="title">Кейсы и Призы</div></div>
    <div class="content">
      <div class="tabs">
        ${cases.map(c=>`<button class="tab ${state.activeCase===c.id?'active':''}" onclick="setActiveCase('${c.id}')">${c.name}</button>`).join('')}
      </div>

      <div class="card" style="background:var(--surface3);">
        <h4 style="margin-bottom:10px;">Добавить приз</h4>
        <select class="input" id="prType">
          <option value="percent">Скидка (%)</option>
          <option value="fixed">Скидка (₽)</option>
          <option value="bonus">Бонусы</option>
          <option value="product">Товар</option>
        </select>
        <input class="input" id="prName" placeholder="Название (Скидка 10%)">
        <input class="input" id="prDesc" placeholder="Описание (На любой заказ)">
        <input class="input" id="prValue" type="number" placeholder="Значение (10 или 500)">
        <input class="input" id="prChance" type="number" placeholder="Шанс выпадения % (напр. 40)">
        <input class="input" id="prDuration" type="number" placeholder="Срок действия в днях (напр. 7)">
        <button class="btn btn-primary" onclick="addPrize()">Добавить</button>
      </div>

      <h4>Список призов (${currentPrizes.length})</h4>
      ${currentPrizes.map(p=>`
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <b>${escapeHtml(p.name)}</b>
              <div style="font-size:12px; color:var(--muted);">${escapeHtml(p.desc)}</div>
              <div style="font-size:12px; color:var(--accent);">Шанс: ${p.chance}% | Дней: ${p.duration}</div>
            </div>
            <button class="btn btn-danger btn-sm" onclick="deletePrize(${p.id})">Удалить</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function setActiveCase(id) { state.activeCase = id; render(); }

function addPrize() {
    const type = document.getElementById('prType').value;
    const name = document.getElementById('prName').value;
    const desc = document.getElementById('prDesc').value;
    const value = parseInt(document.getElementById('prValue').value) || 0;
    const chance = parseInt(document.getElementById('prChance').value) || 0;
    const duration = parseInt(document.getElementById('prDuration').value) || 0;
    
    if (!name || chance <= 0) return alert("Введите название и шанс!");

    const newPrize = {
        id: Date.now(),
        type, name, desc, value, chance, duration, icon: type === 'product' ? '📦' : type === 'bonus' ? '🪙' : '🏷️'
    };

    if (!state.prizes[state.activeCase]) state.prizes[state.activeCase] = [];
    state.prizes[state.activeCase].push(newPrize);
    
    sendToBot("update_prizes", { case_id: state.activeCase, prizes: state.prizes[state.activeCase] });
    render();
}

function deletePrize(id) {
    if (!confirm("Удалить приз?")) return;
    state.prizes[state.activeCase] = state.prizes[state.activeCase].filter(p => p.id !== id);
    sendToBot("update_prizes", { case_id: state.activeCase, prizes: state.prizes[state.activeCase] });
    render();
}

function renderPromos(){
  return `
    <div class="header"><div class="title">Промокоды</div></div>
    <div class="content">
      <div class="card" style="background:var(--surface3);">
        <h4 style="margin-bottom:10px;">Создать персональный промокод</h4>
        <input class="input" id="promoCode" placeholder="Код (напр. GALLEON10)">
        <input class="input" id="promoDiscount" type="number" placeholder="Скидка %">
        <input class="input" id="promoDays" type="number" placeholder="Срок действия (дней, 0 = бессрочно)">
        
        <select class="input" id="promoTypeSelect" onchange="togglePromoLimit()">
          <option value="one_time">Одноразовый (1 клиент)</option>
          <option value="multi">Многоразовый</option>
        </select>
        
        <input class="input hidden" id="promoLimit" type="number" placeholder="Сколько раз можно активировать (напр. 50)" style="display:none;">
        
        <button class="btn btn-primary" onclick="createPromo()">Создать</button>
      </div>
      
      <p style="font-size:12px; color:var(--muted); margin-top:20px; text-align:center;">
        После создания код отправится на сайт (1-2 минуты).<br>
        Клиент сможет ввести его при оформлении заказа.
      </p>
    </div>
  `;
}

function togglePromoLimit() {
    const type = document.getElementById('promoTypeSelect').value;
    const limitInput = document.getElementById('promoLimit');
    if (type === 'multi') {
        limitInput.style.display = 'block';
    } else {
        limitInput.style.display = 'none';
        limitInput.value = '';
    }
}

function createPromo() {
    const code = document.getElementById('promoCode').value.trim().toUpperCase();
    const discount = parseInt(document.getElementById('promoDiscount').value) || 0;
    const days = parseInt(document.getElementById('promoDays').value) || 0;
    const type = document.getElementById('promoTypeSelect').value;
    
    let limit = 1;
    if (type === 'multi') {
        limit = parseInt(document.getElementById('promoLimit').value);
        if (!limit || limit <= 0) return alert("Укажите, сколько раз можно использовать промокод!");
    }
    
    if (!code || discount <= 0) return alert("Заполните код и скидку!");
    
    sendToBot("create_promo", { 
        code, 
        discount, 
        days, 
        limit, 
        is_one_time: type === 'one_time' 
    });
    
    alert("Промокод создан! Сайт обновится через 1-2 минуты.");
    goTab('home');
}

loadData();
</script>
</body>
</html>
